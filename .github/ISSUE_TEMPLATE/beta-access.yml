name: Beta access
description: Apply to test X Hot Reply Copilot
title: "[Beta] "
labels: ["beta"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping test X Hot Reply Copilot. Do not include API keys, private posts, or confidential product information.
  - type: dropdown
    id: account-type
    attributes:
      label: Account type
      options:
        - Product or company account
        - Founder or personal account
        - Agency or multiple accounts
    validations:
      required: true
  - type: input
    id: product
    attributes:
      label: Public product or profile URL
      description: Optional. Only share a URL that is already public.
  - type: textarea
    id: goal
    attributes:
      label: What do you want to improve?
      placeholder: Finding reply opportunities, reply quality, workflow speed...
    validations:
      required: true
